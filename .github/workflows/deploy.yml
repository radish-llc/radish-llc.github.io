name: Deploy to GCP Cloud Run
on:
  push:
    branches: [main]

env:
  IMAGE_NAME: radish-llc
  TAG: ${{ github.sha }}
  GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.0

      - name: Debug OIDC token claims
        run: |
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | python3 -c "import sys, json; print(json.load(sys.stdin)['value'])")
          python3 -c '
          import base64, json, sys
          token = sys.argv[1]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          print(json.dumps(json.loads(base64.urlsafe_b64decode(payload)), indent=2))
          ' "$OIDC_TOKEN"

      - name: Set up GCP authentication
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_ID }}/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: 668282322569-compute@developer.gserviceaccount.com

      - name: Set up GCP CLI
        uses: google-github-actions/setup-gcloud@v2.2.0

      - name: Configure Docker for GCP
        run: gcloud auth configure-docker

      - name: Build Docker image
        run: |
          docker build -t ${GCP_PROJECT}-docker.pkg.dev/${GCP_PROJECT}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}:${{ env.TAG }} .

      - name: Push Docker image
        run: |
          docker push ${GCP_PROJECT}-docker.pkg.dev/${GCP_PROJECT}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}

      - name: Deploy to Cloud Run
        if: ${{ vars.CLOUD_RUN_NAME }}
        env:
          CLOUD_RUN_NAME: ${{ vars.CLOUD_RUN_NAME }}
          CLOUD_RUN_ZONE: ${{ vars.CLOUD_RUN_ZONE }}
        run: |
          gcloud run deploy ${CLOUD_RUN_NAME} \
            --project=${GCP_PROJECT_ID} \
            --image=${GCP_PROJECT}-docker.pkg.dev/${GCP_PROJECT}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}:${{ env.TAG }} \
            --platform=managed \
            --region=${CLOUD_RUN_ZONE} \
            --service-account=668282322569-compute@developer.gserviceaccount.com \
            --allow-unauthenticated
