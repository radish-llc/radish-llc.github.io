name: Deploy to GCP Cloud Run
on:
  push:
    branches: [main]

env:
  IMAGE_NAME: radish-llc
  TAG: ${{ github.sha }}
  GCP_PROJECT: ${{ vars.GCP_PROJECT_NUMBER }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  CLOUD_RUN_ZONE: ${{ vars.CLOUD_RUN_ZONE }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.0

      - name: Debug OIDC token claims
        env:
          OIDC_TOKEN: ${{ github.token }}
        run: |
          python3 -c '
          import base64, json, os
          token = os.environ["OIDC_TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          print(json.dumps(json.loads(base64.urlsafe_b64decode(payload)), indent=2))
          '

      - name: Set up GCP authentication
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID_ }}
          workload_identity_provider: projects/${{ env.GCP_PROJECT }}/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: 668282322569-compute@developer.gserviceaccount.com

      - name: Set up GCP CLI
        uses: google-github-actions/setup-gcloud@v2.2.0

      - name: Configure Docker for GCP
        run: gcloud auth configure-docker

      - name: Build Docker image
        run: |
          docker build -t ${CLOUD_RUN_ZONE}-docker.pkg.dev/${GCP_PROJECT_ID}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}:${{ env.TAG }} .

      - name: Push Docker image
        run: |
          docker push ${CLOUD_RUN_ZONE}-docker.pkg.dev/${GCP_PROJECT_ID}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}

      - name: Deploy to Cloud Run
        if: ${{ vars.CLOUD_RUN_NAME }}
        env:
          CLOUD_RUN_NAME: ${{ vars.CLOUD_RUN_NAME }}
          CLOUD_RUN_ZONE: ${{ vars.CLOUD_RUN_ZONE }}
        run: |
          gcloud run deploy ${CLOUD_RUN_NAME} \
            --project=${GCP_PROJECT_ID} \
            --image=${CLOUD_RUN_ZONE}-docker.pkg.dev/${GCP_PROJECT_ID}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}:${{ env.TAG }} \
            --platform=managed \
            --region=${CLOUD_RUN_ZONE} \
            --service-account=668282322569-compute@developer.gserviceaccount.com \
            --allow-unauthenticated
