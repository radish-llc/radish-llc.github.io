name: Deploy to GCP Cloud Run
on:
  push:
    branches: [main]

env:
  IMAGE_NAME: radish-llc
  TAG: ${{ github.sha }}
  GCP_PROJECT: ${{ secrets.GCP_PROJECT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.0

      - name: Set up GCP authentication
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: //iam.googleapis.com/projects/${{ env.GCP_PROJECT }}/locations/global/workloadIdentityPools/github/providers/github-actions

      - name: Set up GCP CLI
        uses: google-github-actions/setup-gcloud@v2.2.0

      - name: Configure Docker for GCP
        run: gcloud auth configure-docker

      - name: Build Docker image
        run: |
          docker build -t ${GCP_PROJECT}-docker.pkg.dev/${GCP_PROJECT}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}:${{ env.TAG }} .

      - name: Push Docker image
        run: |
          docker push ${GCP_PROJECT}-docker.pkg.dev/${GCP_PROJECT}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}

      - name: Deploy to Cloud Run
        if: ${{ vars.CLOUD_RUN_NAME && vars.GCP_SERVICE_ACCOUNT_EMAIL }}
        env:
          CLOUD_RUN_NAME: ${{ vars.CLOUD_RUN_NAME }}
          CLOUD_RUN_ZONE: ${{ vars.CLOUD_RUN_ZONE }}
        run: |
          gcloud config set-default compute zone ${CLOUD_RUN_ZONE}
          gcloud container-orchestration deployments create ${CLOUD_RUN_NAME} \
            --image=${GCP_PROJECT}-docker.pkg.dev/${GCP_PROJECT}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}:${{ env.TAG }} \
            --service-account=${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }} \
            --port=80 \
            --restart-policy=Always