name: Deploy to GCP Cloud Run
on:
  push:
    branches: [main]

env:
  IMAGE_NAME: radish-llc
  TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up GCP authentication
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}
          service_account_key: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Configure Docker for GCP
        run: gcloud auth configure-docker

      - name: Build Docker image
        run: |
          if [ -z "${{ secrets.GCP_PROJECT }}" ]; then
            echo "ERROR: GCP_PROJECT secret is not set."
            exit 1
          fi
          docker build -t gcr.io/${{ secrets.GCP_PROJECT }}/${{ env.IMAGE_NAME }}:${{ env.TAG }} .

      - name: Push Docker image
        run: |
          docker push gcr.io/${{ secrets.GCP_PROJECT }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}

      - name: Deploy to Cloud Run
        if: ${{ vars.CLOUD_RUN_NAME }}
        env:
          CLOUD_RUN_NAME: ${{ vars.CLOUD_RUN_NAME }}
          CLOUD_RUN_ZONE: ${{ vars.CLOUD_RUN_ZONE }}
        run: |
          gcloud config set-default zone ${CLOUD_RUN_ZONE}
          gcloud container-orchestration deployments create ${CLOUD_RUN_NAME} \
            --image=gcr.io/${{ secrets.GCP_PROJECT }}/${{ env.IMAGE_NAME }}:${{ env.TAG }} \
            --port=80 \
            --restart-policy=Always